{% extends 'layout/base.html' %}

{% block content %}
<h1 class="text-center text-success at-2">ĐĂNG NHẬP NGƯỜI DÙNG</h1>
<form method="post" action="/login">
    <div class="form-floating mb-3 mt-3">
        <input type="text" class="form-control" id="username" placeholder="Tên đăng nhập" name="email">
        <label for="email">Tên đăng nhập</label>
        <input type="password" class="form-control" id="password" placeholder="Mật khẩu" name="email">
        <label for="email">Mật khẩu</label>
    </div>
    <div class="form-floating mb-3 at-3">
        <button class="btn btn-success">Đăng nhập</button>
    </div>
</form>

{% endblock %}
